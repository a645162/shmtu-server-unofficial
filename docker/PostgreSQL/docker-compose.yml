services:
  postgres:
    image: postgres:18
    # container_name: pg-service
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: yd
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai

    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai

    ports:
      - "5432:5432"

    volumes:
      - ./data:/var/lib/postgresql # ✅ 正确（18新结构）
      - ./logs:/var/log/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d yd"]
      interval: 10s
      timeout: 5s
      retries: 5

    # # 可选：限制资源（建议）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g
