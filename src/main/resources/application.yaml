spring:
  application:
    name: shmtu-server-unofficial
  docker:
    compose:
      file: docker/PostgreSQL/docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/yd
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

server:
  port: 8080

jwt:
  secret: "shmtu-server-unofficial-jwt-secret-key-change-in-production"
  expiration: 86400000

encryption:
  aes:
    key: "shmtu-aes-secret-key-change-in-production"

ocr:
  # 多 OCR 服务器：调度器按平均耗时升序动态排序；调用时按序尝试，单台失败立即换下一台，最多试 max-try 台。
  # 默认端口：TCP = 21601, RESTful API = 21600
  servers:
    - name: local-http
      mode: http
      enabled: true
      base-url: http://localhost:21600
    - name: local-tcp
      mode: tcp
      enabled: true
      host: 127.0.0.1
      port: 21601
    - name: gpu-server
      mode: http
      enabled: false
      base-url: http://gpu-host:21600
  max-try: 3
  per-server-timeout-ms: 3000
  window-size: 20
  initial-weight: 1000
  # Monitor 模块：每 N 毫秒主动探活每台 enabled OCR 服务器，把结果灌入 OcrServerRegistry。
  # 替代旧 shmtu-service-monitor (Rust axum) 的 poller；前端 monitor 页面通过 /api/ocr/servers 读取。
  monitor:
    initial-delay-ms: 5000
    interval-ms: 10000

scheduler:
  bill-sync:
    enabled: true
    cron: "0 0 */2 * * *"
  session-check:
    enabled: true
    cron: "0 0 * * * *"
  session-expire-threshold: 30
