spring:
  application:
    name: shmtu-server-unofficial
  docker:
    compose:
      file: docker/PostgreSQL/docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/yd
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

server:
  port: 8080

jwt:
  secret: "shmtu-server-unofficial-jwt-secret-key-change-in-production"
  expiration: 86400000

encryption:
  aes:
    key: "shmtu-aes-secret-key-change-in-production"

ocr:
  mode: http
  tcp:
    host: localhost
    port: 5000
  http:
    base-url: http://localhost:5001
  retry-times: 3

scheduler:
  bill-sync:
    enabled: true
    cron: "0 0 */2 * * *"
  session-check:
    enabled: true
    cron: "0 0 * * * *"
  session-expire-threshold: 30
